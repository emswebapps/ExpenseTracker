<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=/ExpenseTracker/rx/" />
    <title>Rx</title>
    <script>
      // "Reset" became "Rx" when the crash protocol stopped being the whole app
      // and became one tool inside a medication tracker. This page exists only
      // so the icon already on someone's home screen keeps opening the app, and
      // so notifications sent before the rename still land somewhere real.
      //
      // Query and hash are carried across: /reset/?open=anchors has to survive,
      // because the scheduler's dedupe map means a push can be tapped a day
      // after it was sent.
      location.replace('/ExpenseTracker/rx/' + location.search + location.hash);
    </script>
  </head>
  <body>
    <p style="font: 16px system-ui; padding: 2rem">
      This app is now called Rx. <a href="/ExpenseTracker/rx/">Open it →</a>
    </p>
  </body>
</html>
