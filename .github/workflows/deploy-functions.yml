name: Deploy Cloud Functions & Rules

# The web app deploys itself to Pages, but the backend — the reminder logic in
# Cloud Functions, plus the Firestore and Storage security rules — used to need
# a local Firebase CLI. This does that deploy on merge instead, and can be run
# by hand from the Actions tab, which is how you trigger the very first deploy
# without pushing anything.

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      # Security rules are backend too, and they were deploying nowhere: the
      # Pages workflow only builds the site, and this one used to say
      # `--only functions`. A feature whose rules never shipped is a feature
      # that 403s in production while working perfectly on a dev machine.
      #
      # Indexes are deliberately NOT deployed. firestore.indexes.json is empty,
      # and `--only firestore:indexes` with `--force` reads that as "there
      # should be no composite indexes" and deletes any that exist. Add them to
      # the file first if this ever needs to manage them.
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-functions.yml'
      # The checks that gate this deploy live here, so a change to one of them
      # is a change to the deploy and should re-run it.
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys of the same functions overlap.
concurrency:
  group: functions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: `node --test` only learned glob patterns in 22, and
          # `npm run test:unit` passes one. On 20 the pattern reaches the test
          # runner literally and it reports "Could not find src/**/*.test.js".
          # (The Cloud Functions *runtime* is pinned separately, by the engines
          # field in functions/package.json — this is only the build machine.)
          node-version: 22

      - name: Install function dependencies
        working-directory: functions
        run: npm install

      # A broken reminder is worse than a late one, so the unit tests gate the
      # deploy rather than running alongside it.
      - name: Run tests
        working-directory: functions
        run: npm test

      # The rules ship from this workflow, so they're tested here too — against
      # the real Firestore emulator, since the only way to know what a rule
      # does is to run it. Needs the root dependencies for the test harness.
      - name: Install root dependencies
        run: npm install

      - name: Test security rules
        run: npm run test:rules

      - name: Check the deploy credential exists
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Repository secret FIREBASE_SERVICE_ACCOUNT is not set."
            echo "::error::See Backup/FUNCTIONS_DEPLOY_SETUP.md for how to create it."
            exit 1
          fi

      - name: Write the service account key
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$KEY" > "$RUNNER_TEMP/gcp-key.json"

      # The Firebase CLI reports every credential problem — bad paste, wrong
      # project, revoked key — as "Failed to authenticate, have you run firebase
      # login?", which is not enough to act on. Check what can be checked
      # locally first, so the log names the actual problem.
      - name: Validate the service account key
        run: |
          node .github/scripts/validate-service-account.mjs \
            "$RUNNER_TEMP/gcp-key.json" billtracker-256ef

      # The key can be perfectly valid and the deploy still fail, because a role
      # is missing or an API the deploy needs is switched off. Those surface
      # deep into the deploy, phrased as whichever Google service noticed
      # first. Ask Google up front instead, so the log names every missing
      # piece at once — with the link to fix each — before anything is built.
      - name: Preflight the project
        run: |
          node .github/scripts/preflight-deploy.mjs \
            "$RUNNER_TEMP/gcp-key.json" billtracker-256ef

      # --debug so that a failure Google *does* reject (revoked key, missing
      # role, disabled API) prints its real cause instead of the same vague
      # line. It does not log the auth header, so the credential stays out of
      # the log.
      - name: Deploy functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
        run: |
          npx --yes firebase-tools deploy \
            --only functions,firestore:rules,storage \
            --project billtracker-256ef \
            --non-interactive \
            --force \
            --debug

      # The key is a real credential — don't leave it on the runner disk even
      # though the runner is discarded, and remove it even if the deploy failed.
      - name: Shred the key
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-key.json"
